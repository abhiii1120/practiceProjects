# ==============================================================================
# GitHub Actions CI/CD Pipeline
# ==============================================================================
# This workflow automates continuous integration (testing) and continuous
# deployment (triggering Render deploy hook) whenever changes are merged
# or pushed to the `main` branch.
# ==============================================================================

name: kodex-ci-cd-pipeline

# Trigger the workflow automatically on every push targeting the 'main' branch
on:
  push:
    branches:
      - main

jobs:
  # ============================================================================
  # 1. TEST JOB (Continuous Integration)
  # ============================================================================
  # Validates that code passes linting/testing requirements before deployment.
  # Executes against an isolated Ubuntu runner using in-memory MongoDB.
  test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository source code to the runner
      - name: Checkout repository code
        uses: actions/checkout@v4

      # Step 2: Set up Node.js runtime and cache npm dependencies for faster builds
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Step 3: Install all project dependencies (including devDependencies like Jest)
      - name: Install dependencies
        run: npm install

      # Step 4: Run test suite with Jest and Supertest
      - name: Run automated tests
        run: npm test

  # ============================================================================
  # 2. DEPLOY JOB (Continuous Deployment)
  # ============================================================================
  # Automatically deploys the application to the hosting platform (Render).
  # The 'needs: test' constraint ensures deployment executes ONLY if the test
  # job completes successfully.
  deploy:
    runs-on: ubuntu-latest
    needs: test # Quality gate: Deployment will not trigger if tests fail

    steps:
      # Step 1: Trigger the Render service deployment via webhook
      # Secrets used:
      # - RENDER_DEPLOY_HOOK: Webhook URL generated from the Render service dashboard
      - name: Deploy to Render
        run: |
          # Trigger deployment using Render's Instant Deploy webhook
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"